[package]
name = "privaxy-app"
version = "0.1.1"
edition = "2024"
default-run = "privaxy-app"
description = "Privaxy - A privacy-focused ad-blocking proxy"
authors = ["Privaxy Contributors"]
license = "MIT"

[dependencies]
base64 = "0.22"
# Dioxus core with desktop and router
dioxus = { version = "0.7.2", features = ["desktop", "router"], optional = true }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Formatting
num-format = "0.4.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }

# Native file dialogs share the runtime-independent backend used by egui-theme-kit.
rfd = "0.17"

# Privaxy core library
privaxy = { path = "../privaxy" }

eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "persistence"] }
egui-theme-kit = { git = "https://github.com/shadowbrok3r/egui-theme-kit", rev = "09d1e793076357ec5d86df7e1d6771d0306f2e70", default-features = false, features = ["title-bar", "picker", "files"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rand = "0.9"
dirs = "6"
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.15"

[features]
default = []
legacy = ["dep:dioxus"]

[[bin]]
name = "privaxy-legacy"
path = "src/legacy.rs"
required-features = ["legacy"]

[[bin]]
name = "privaxy-app"
path = "src/main.rs"
